[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nullsim"
version = "0.1.0"
description = "A generalized photonic nulling instrument simulator."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Ben Mazin", email = "experimentalastrophys@gmail.com" },
]
keywords = [
    "astronomy",
    "interferometry",
    "nulling",
    "photonics",
    "exoplanets",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "tqdm",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = ["pytest>=8", "pytest-xdist>=3"]

[project.urls]
Homepage = "https://github.com/MazinLab/nullsim"
Source = "https://github.com/MazinLab/nullsim"
Issues = "https://github.com/MazinLab/nullsim/issues"

[project.scripts]
nullsim = "nullsim.cli:main"

[tool.setuptools.packages.find]
include = ["nullsim*"]

[tool.setuptools.package-data]
nullsim = [
    "data/**/*.json",
    "data/**/*.csv",
    "config/presets/*.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "stats: scientific validation tests with diagnostic plot output",
]

[tool.ruff]
target-version = "py312"
line-length = 88
