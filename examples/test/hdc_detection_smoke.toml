# Detection-mode HDC: `performance.hdc` turning the matched filter around to
# ask how faint a planet the dark ports would still detect, and overlaying the
# answer on the broadband contrast curve in `detection_space`.
#
# The detection-mode counterpart of `hdc_ccf_smoke.toml`, and derived from the
# same four-mode chain. Two structural differences:
#
#   * The `characterization.spectro` + `characterization.hdc_ccf` pair is gone.
#     Detection mode reads `performance.standard` and
#     `sensitivity.detection_curve` instead, so the characterization branch is
#     dead weight here -- dropping it also keeps the run to a couple of
#     seconds.
#   * The two systematics knobs of `hdc_ccf_systematics.toml` are set on
#     `performance.standard`, at eps = 1e-3 rather than that config's 4e-3
#     (`residual_speckle_stability_factor = 1e-3`, `with_fringe_tracking =
#     false`). That is a deliberate choice, and it is what makes this config
#     worth shipping: in a purely photon limited regime the CCF LOSES to the
#     broadband curve (gain < 1), because the matched filter throws away most
#     of the planet's photons to isolate the lines. Nothing is wrong when
#     that happens -- there is no systematic to reject -- but an example whose
#     whole point is the overlay should show an overlay worth looking at.
#     With the quasi-static leak instability in place the CCF wins at every
#     anchor.
#
# `with_fringe_tracking = false` selects the quasi-static branch of the
# null-instability variance, (eps * leak_counts)^2, rather than the averaging
# branch eps^2 * leak_rate^2 * t / (2 f_servo). It is not a claim that the
# fringe tracker is off -- `fringe_tracking.closed_loop` still runs. It asserts
# that the 1e-3 leak fluctuation stays coherent across the whole 3600 s
# exposure. Nothing upstream derives that correlation time; it is asserted
# here, exactly as in `hdc_ccf_systematics.toml`, and the same caveats apply.
#
# `performance.hdc` deliberately sets neither `integration_time_s` nor
# `target_snr`. Both are inherited from the broadband curve's own metadata
# (`contrast_curve_reference_time_s` and `target_snr` on
# `performance.standard`), which is what guarantees `ccf_contrast_gain`
# compares two curves describing the same observation. An explicit value that
# disagreed would be refused rather than reconciled.
#
# Achieved (2026-11-07, single-telescope geometry, after the 2026-11-07
# review fixes, ~3 s wall clock), at every anchor:
#
#   ccf_contrast_gain      5.007   with the two knobs below
#   ccf_contrast_gain      0.163   with them removed (photon limited)
#
# The switch costs the broadband curve a factor 34.9 at 10 mas (1.82e-6 ->
# 6.34e-5) and the CCF curve only a factor 1.14 (1.12e-5 -> 1.27e-5). That
# asymmetry is the entire result. These are plumbing numbers, not a
# sensitivity prediction.
#
# Until 2026-11-07 this chain declared a four-telescope array, kept its
# 314 m^2 collecting area, and placed the modes inside one 10 m pupil (review
# 2026-11-07 Issue 22); the gains were 28.199 and 0.626 before the
# 2026-11-07 review fixes. The history below refers to that geometry. Both
# gains moved by 3.8x in the wave C stage-accounting pass (7.483 -> 28.183
# and 0.163 -> 0.618), then by a further 0.06% when the continuum
# filter became blockwise over telluric islands (28.183 -> 28.199 and
# 0.618 -> 0.626): `performance.hdc` now normalizes its
# unit-contrast planet against the PHYSICAL stellar rate rather than the
# MKID-saturation-capped readout total, and at J = 5 this four-mode chain
# saturated the bright ports by 3.804x. The broadband side has since been
# reconciled: `performance.standard` also normalizes to the physical stellar
# rate, so both curves share one normalization and the saturation
# RuntimeWarning is gone (28.199 -> 9.327 and 0.626 -> 0.1645 in the old
# geometry). In the single-telescope geometry no port saturates; the bright
# ports run at 0.68 of the MKID cap.
#
# The gain is the SAME at every anchor, and that is structural rather than a
# coincidence -- but it is a property of `performance.hdc`'s inputs, not of the
# instrument. The stage receives one planet throughput per separation from
# `sensitivity.detection_curve` and one leakage rate from
# `performance.standard`, both already band averaged, and it spreads them
# across the band as grey. Under that approximation the CCF and broadband
# curves scale with separation identically, so the overlay is two parallel
# lines. The physical chip is NOT grey: its unitaries are wavelength
# dependent and `physics/planet_throughput.py` evaluates the dark-port
# throughput per wavelength before averaging. Feeding `performance.hdc` the
# per-wavelength curves instead of the band averages would break the
# degeneracy; the flat gain is a statement about the current interface.
#
# The injected planet contrast of 1e-4 is far brighter than a real
# reflected-light Earth analogue (~1e-9) and only sets the scene; the contrast
# CURVE is what this config is about, and it does not depend on the injected
# planet.

[run]
name = "hdc_detection_smoke"
description = "Four-mode detection-mode HDC contrast curve around an M2V host."
seed = 1

[grid]
wavelength_center_um = 1.25
wavelength_bandwidth_um = 0.15
n_wavelength_bins = 5

[scene.star]
jmag = 5.0
spectral_type = "M2V"
angular_diameter_mas = 0.8
distance_pc = 5.0

[scene.planet]
contrast = 1.0e-4
separation_mas = 30.0
position_angle_deg = 0.0
radial_velocity_kms = 30.0

[scene.exozodi]
level_zodi = 1.0

[observation]
hour_angle_h = 0.0
integration_time_s = 3600.0

[[pipeline.stages]]
id = "scene"
type = "scene.point_source"
altitude_deg = 80.0
azimuth_deg = 180.0

# One 10 m telescope whose pupil hosts the four input modes. An earlier
# version declared a four-telescope Y array (40 m spacing) here and then
# overwrote its positions with these pupil modes while keeping the array's
# collecting area; `telescope.pupil_modes` now rejects multi-telescope
# geometry (review 2026-11-07 Issue 22). The mode positions are unchanged;
# the inter-telescope delay lines went with the array.
[[pipeline.stages]]
id = "array"
type = "telescope.fixed_aperture"
diameter_m = 10.0
n_apertures = 1
mirror_transmission = 0.80

[[pipeline.stages]]
id = "pupil_modes"
type = "telescope.pupil_modes"
n_modes = 4
layout = "packed_circular"
span_fraction = 1.0

[[pipeline.stages]]
id = "atmosphere"
type = "atmosphere.kolmogorov"
r0_500nm_m = 0.15
L0_m = 25.0
wind_speed_m_s = 10.0
atmospheric_transmission = 0.93

[[pipeline.stages]]
id = "ao"
type = "ao.pyramid_wfs"
n_actuators = 3025
loop_frequency_hz = 2000.0
pupil_template = "full_pupil"
n_subap_across = 50
derive_r_mag_from_scene_jmag = true
excess_noise_sq = 1.0
readout_noise_e_rms = 0.0
central_obstruction = 0.24
tau0_500nm_s = 2.83e-3
theta0_500nm_arcsec = 1.19
v_wind_m_s = 10.0

[[pipeline.stages]]
id = "injection_seed"
type = "injection.ideal"
n_modes = 4
apply_strehl_coupling = false

[[pipeline.stages]]
id = "injection"
type = "injection.single_mode_fiber"
central_obscuration_ratio = 0.24

[[pipeline.stages]]
id = "smf28"
type = "transport.smf28"
length_m = 10.0
phi_rms_rad = 0.01

[[pipeline.stages]]
id = "chip_opt"
type = "chip_optimization.scipy"
n_modes = 4
n_bright_ports = 2
n_dark_ports = 1
n_spectro_ports = 1
wl_design_um = 1.25
target_null_depth = 1.0e-5
max_iter = 30
seed = 0

[[pipeline.stages]]
id = "chip"
type = "chip.kernel_mzi_mesh"
n_modes = 4
n_bright_ports = 2
n_dark_ports = 1
n_spectro_ports = 1
wl_design_um = 1.25
optimization_source = "auto"

[[pipeline.stages]]
id = "detector"
type = "detector.mkid"
qe = 0.7
mkid_max_count_rate_hz = 5.0e4
n_pixels_bright = 5000
n_pixels_dark = 500
n_bright_ports = 2
n_dark_ports = 1
n_spectro_ports = 1
n_modes = 4
integration_time_s = 3600.0
band = "J"

[[pipeline.stages]]
id = "fringe_tracking"
type = "fringe_tracking.closed_loop"
servo_bw_hz = 2000.0
fringe_visibility = 0.9
n_spectral_channels = 10
n_spectral_eff = 2.5
predictive_lag_reduction = 0.05
wind_speed_m_s = 10.0

[[pipeline.stages]]
id = "calibration"
type = "calibration.floor_lookup"
default_floor_log10 = -6.0
band = "J"

[[pipeline.stages]]
id = "sensitivity"
type = "sensitivity.detection_curve"
n_bright_ports = 2
n_dark_ports = 1
n_spectro_ports = 1
# Seven anchors instead of the three `hdc_ccf_smoke.toml` uses, chosen to stay
# inside the pupil-mode array's usable field: the planet throughput peaks near
# 25 mas (0.22), is 0.059 at 50 mas, and falls to 2.9e-4 by 100 mas, where the
# broadband 5-sigma contrast is 1.7e-2. In the earlier four-telescope geometry
# the 100 mas contrast came out above 1 and `detection_space` dropped it.
separations_mas = [5.0, 10.0, 15.0, 20.0, 30.0, 40.0, 50.0]
n_pa_samples = 12
include_angular_coupling = true
n_azimuths = 1
n_realizations_per_azimuth = 0
n_mc_realizations = 0
mc_seed = 0

[[pipeline.stages]]
id = "performance"
type = "performance.standard"
target_snr = 5.0
# Quasi-static leak instability: the regime HDC exists to beat. See the header.
residual_speckle_stability_factor = 1.0e-3
with_fringe_tracking = false

[[pipeline.stages]]
id = "hdc_detection"
type = "performance.hdc"
planet_template = "earth"
telluric_template = "maunakea"
# Dark-port disperser. Detection mode has no upstream AWG payload to inherit
# from, unlike characterization mode, so the disperser is configured here.
awg_resolving_power = 3000.0
awg_throughput = 0.8
# integration_time_s and target_snr are deliberately unset: both are inherited
# from the broadband curve so the gain ratio compares like with like.

[output]
dir = "results/{run.name}/{timestamp}"
plots = ["detection_space"]
tables = ["performance_summary", "hdc_detection"]

[output.formats]
tables = ["json"]

[cache]
enabled = true
dir = ".nullsim_cache"
version = 1
