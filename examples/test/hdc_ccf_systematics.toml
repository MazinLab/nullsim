# Systematics-dominated companion to `hdc_ccf_smoke.toml`: the case where
# cross-correlation actually buys something. The smoke config is photon
# limited, and there the matched filter LOSES to the broadband band SNR
# (ccf_snr 70.22 against band 387.41) -- correctly, because it throws away
# most of the planet's photons to isolate the lines. Here the leaked
# starlight carries a quasi-static instability. It costs the band a factor
# 125 and the CCF a factor 2.2, and that asymmetry is the whole point.
#
# The only changes from the smoke config are two knobs, set identically on
# `characterization.spectro` and `performance.standard`:
#
#   residual_speckle_stability_factor = 1.0e-3   (eps_systematic = 1e-3)
#   with_fringe_tracking              = false
#
# `with_fringe_tracking = false` is not a claim that the fringe tracker is
# switched off -- `fringe_tracking.closed_loop` still runs. It selects the
# quasi-static branch of the null-instability variance,
# (eps * leak_counts)^2 rather than eps^2 * leak_rate^2 * t / (2 f_servo).
# That branch asserts the 1e-3 fluctuation is perfectly coherent across the
# whole 3600 s exposure: no averaging at all, correlation time >= t. Nothing
# upstream in the pipeline derives that correlation time -- it is hand set
# here, and it is the assumption the entire demonstration rests on. A
# quasi-static speckle is the systematic HDC exists to remove, so it is the
# right branch for this example, but the number is asserted, not computed.
#
# At THIS config's operating point the averaging branch cannot substitute:
# with f_servo = 2 kHz, CCF systematic variance only overtakes CCF photon
# noise for eps > 2.0 (dominance needs eps^2 / f_servo > 2.04e-3). That is a
# statement about 2 kHz, not about the branch -- at a 30 Hz speckle
# decorrelation bandwidth the same inequality needs only eps > 0.25, which is
# large but not absurd. A config wanting the averaging branch would have to
# argue for both numbers.
#
# Achieved at 3600 s (run 20260809-160535, ~2 s wall clock):
#
#   spectro band SNR       3.11   (S = 4.84e7, B = 1.56e10 counts,
#                                  systematic_var = 2.43e14 counts^2)
#   ccf_snr               31.29   -> HDC wins by 10.07x
#   ccf_snr_photon_limited 70.22
#   ccf_systematic_var / ccf_photon_var = 1.976e4 / 4895 = 4.04
#   ccf_systematic_rejection = 0.026
#   rv_leak_contamination 357.7, effective 0.358 -> localization "marginal"
#
# The header read 3.76 for the variance ratio until now; that number predates
# the covariance and blockwise-island fixes and was never refreshed. Nothing in
# the round-4 pass moved this config: ccf_snr, the band SNR and both variances
# are bit-identical to the previous run.
#
# Read that rejection factor as one illustrative realization. It is
# |sum w L~| / (sum |w| L) for ONE coherent scalar eps multiplying ONE smooth
# leak spectrum: the continuum filter keeps 2.5% of what the band SNR
# swallows whole. There is no chromatic-speckle covariance model behind it. A
# perturbation with structure at the line scale would project onto the
# template differently -- possibly much more strongly, possibly less -- and
# this config says nothing about that case.
#
# Panel (c) of the `hdc_ccf` plot shows the realized curve far below the
# photon limit at R = 100 and converging toward it by R = 3e4, as narrower
# channels resolve the planet's lines away from the smooth leak.
#
# Everything below is inherited from `hdc_ccf_smoke.toml`.
#
# Minimal end-to-end exercise of the high dispersion coronagraphy (HDC)
# cross-correlation path: `characterization.hdc_ccf` behind an AWG-dispersed
# `characterization.spectro` port.
#
# Derived from `mkid_native_spectro.toml` -- same four-mode array, same short
# optimizer settings -- with three changes that matter for HDC:
#
#   * An M2V host. Reflected-light Earth analogues around Sun-like stars are
#     out of reach for a ground nuller; M dwarfs put the habitable zone at a
#     contrast and separation the instrument can plausibly reach, so the
#     packaged stellar template resolved from `scene.star.spectral_type` is
#     the M-dwarf one.
#   * A nonzero planet radial velocity, which is what separates the planet's
#     line forest from the leaked stellar continuum in the rest frame of the
#     cross-correlation.
#   * An AWG spectrograph at R = 5000 rather than the MKID's native R ~ 24.
#     HDC is a resolving-power game; the MKID branch fits only a handful of
#     resolution elements across J, which is not a regime where the matched
#     filter has anything to work with.
#
# The injected contrast is deliberately far brighter than a real Earth
# analogue (which sits near 1e-9 in reflected light) so that a CI-scale run
# produces a visible cross-correlation peak. This config is a plumbing test,
# not a sensitivity prediction.

[run]
name = "hdc_ccf_systematics"
description = "Systematics-limited HDC cross-correlation around an M2V host."
seed = 1

[grid]
wavelength_center_um = 1.25
wavelength_bandwidth_um = 0.15
n_wavelength_bins = 5

[scene.star]
jmag = 5.0
spectral_type = "M2V"
angular_diameter_mas = 0.8
distance_pc = 5.0

[scene.planet]
contrast = 1.0e-4
separation_mas = 30.0
position_angle_deg = 0.0
radial_velocity_kms = 30.0

[scene.exozodi]
level_zodi = 1.0

[observation]
hour_angle_h = 0.0
integration_time_s = 3600.0

[[pipeline.stages]]
id = "scene"
type = "scene.point_source"
altitude_deg = 80.0
azimuth_deg = 180.0

[[pipeline.stages]]
id = "array"
type = "telescope.fixed_aperture"
diameter_m = 10.0
n_apertures = 4
array_layout = "y_array"
spacing_m = 40.0
mirror_transmission = 0.80

[[pipeline.stages]]
id = "pupil_modes"
type = "telescope.pupil_modes"
n_modes = 4
layout = "packed_circular"
span_fraction = 1.0
preserve_collecting_area = true

[[pipeline.stages]]
id = "atmosphere"
type = "atmosphere.kolmogorov"
r0_500nm_m = 0.15
L0_m = 25.0
wind_speed_m_s = 10.0
atmospheric_transmission = 0.93

[[pipeline.stages]]
id = "ao"
type = "ao.pyramid_wfs"
n_actuators = 3025
loop_frequency_hz = 2000.0
pupil_template = "full_pupil"
n_subap_across = 50
derive_r_mag_from_scene_jmag = true
excess_noise_sq = 1.0
readout_noise_e_rms = 0.0
central_obstruction = 0.24
tau0_500nm_s = 2.83e-3
theta0_500nm_arcsec = 1.19
v_wind_m_s = 10.0

[[pipeline.stages]]
id = "injection_seed"
type = "injection.ideal"
n_modes = 4
apply_strehl_coupling = false

[[pipeline.stages]]
id = "injection"
type = "injection.single_mode_fiber"
central_obscuration_ratio = 0.24

[[pipeline.stages]]
id = "smf28"
type = "transport.smf28"
length_m = 10.0
phi_rms_rad = 0.01

[[pipeline.stages]]
id = "delay_lines"
type = "delay_lines.geometric"
max_delay_m = 90.0

[[pipeline.stages]]
id = "chip_opt"
type = "chip_optimization.scipy"
n_modes = 4
n_bright_ports = 2
n_dark_ports = 1
n_spectro_ports = 1
wl_design_um = 1.25
target_null_depth = 1.0e-5
max_iter = 30
seed = 0

[[pipeline.stages]]
id = "chip"
type = "chip.kernel_mzi_mesh"
n_modes = 4
n_bright_ports = 2
n_dark_ports = 1
n_spectro_ports = 1
wl_design_um = 1.25
optimization_source = "auto"

[[pipeline.stages]]
id = "detector"
type = "detector.mkid"
qe = 0.7
mkid_max_count_rate_hz = 5.0e4
n_pixels_bright = 5000
n_pixels_dark = 500
n_bright_ports = 2
n_dark_ports = 1
n_spectro_ports = 1
n_modes = 4
integration_time_s = 3600.0
band = "J"

[[pipeline.stages]]
id = "fringe_tracking"
type = "fringe_tracking.closed_loop"
servo_bw_hz = 2000.0
fringe_visibility = 0.9
n_spectral_channels = 10
n_spectral_eff = 2.5
predictive_lag_reduction = 0.05
wind_speed_m_s = 10.0

[[pipeline.stages]]
id = "calibration"
type = "calibration.floor_lookup"
default_floor_log10 = -6.0
band = "J"

[[pipeline.stages]]
id = "sensitivity"
type = "sensitivity.detection_curve"
n_bright_ports = 2
n_dark_ports = 1
n_spectro_ports = 1
separations_mas = [10.0, 30.0, 100.0]
n_pa_samples = 12
include_angular_coupling = true
n_azimuths = 1
n_realizations_per_azimuth = 0
n_mc_realizations = 0
mc_seed = 0

[[pipeline.stages]]
id = "characterization"
type = "characterization.spectro"
n_modes = 4
n_bright_ports = 2
n_dark_ports = 1
n_spectro_ports = 1
wl_design_um = 1.25
null_floor = 1.0e-8
n_restarts = 2
max_iter = 800
seed = 2
broadband_n_wavelengths = 1
band = "J"
spectrograph = "awg"
awg_resolving_power = 5000.0
awg_throughput = 0.7
awg_free_spectral_range_fraction = 1.0
awg_order = 1
awg_pixels_per_resolution_element = 2
n_spectro_pixels = 1
snr_min_per_bin = 3.0
resolving_power_cap = 10000.0
# The two systematics knobs; see the header for the resulting budget. The HDC
# stage reads eps_systematic and the fringe-tracking branch straight off this
# payload, so the CCF and the band SNR are compared under one noise model.
residual_speckle_stability_factor = 1.0e-3
with_fringe_tracking = false

[[pipeline.stages]]
id = "hdc"
type = "characterization.hdc_ccf"
planet_template = "earth"
telluric_template = "maunakea"
integration_time_s = 3600.0
target_snr = 5.0
# Shrunk from the stage defaults to keep the smoke run short: the diagnostic
# scans rebuild the channel grid at every point.
snr_vs_r_points = 6
rv_scan_points = 21
rv_scan_halfwidth_kms = 100.0

[[pipeline.stages]]
id = "performance"
type = "performance.standard"
target_snr = 5.0
# Same systematic in detection mode, so the broadband detection numbers in
# performance_summary describe the same instrument as the spectro row.
residual_speckle_stability_factor = 1.0e-3
with_fringe_tracking = false

[output]
dir = "results/{run.name}/{timestamp}"
plots = ["hdc_ccf"]
tables = ["performance_summary", "characterization_summary"]

[output.formats]
tables = ["json"]

[cache]
enabled = true
dir = ".nullsim_cache"
version = 1
